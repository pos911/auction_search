name: Daily Auction Report

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC = 05:00 KST
  workflow_dispatch: # 수동 실행 지원

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install requests pandas openpyxl
          
      - name: Run Auction Scraper
        run: |
          python run_auction.py
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add madangs_min_kor.csv madangs_report.html
          git commit -m "docs: Daily auction report update" || echo "No changes to commit"
          git push
